name: CI

on:
  push:
    branches: [dev, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: SPA: lint, types, tests, build
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Backend: tests + bootJar
        run: ./gradlew :bot:test :bot:bootJar -PskipWebBuild --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: bot/build/libs/app.jar
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build debug APK + unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
