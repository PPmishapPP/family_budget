name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ветка или тег для деплоя'
        required: false
        default: 'dev'

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build SPA
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build jar
        run: ./gradlew :bot:bootJar -PskipWebBuild --no-daemon -x test

      - name: Upload jar and restart
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"

          PORT="${SSH_PORT:-22}"
          scp -P "$PORT" -i "$HOME/.ssh/deploy_key" \
            bot/build/libs/app.jar "$SSH_USER@$SSH_HOST:/opt/family-budget/incoming/app.jar"

          ssh -p "$PORT" -i "$HOME/.ssh/deploy_key" "$SSH_USER@$SSH_HOST" \
            "sudo family-budget-deploy /opt/family-budget/incoming/app.jar"
