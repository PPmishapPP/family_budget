app:
  security:
    jwt:
      # Для production обязательно задайте собственный JWT_SECRET (32+ байта).
      secret: ${JWT_SECRET:family-budget-dev-secret-change-me-32-bytes}
      access-ttl: 15m
      refresh-ttl: 30d
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring:
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/family_budget_v3}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  flyway:
    enabled: true

logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: INFO

schedule:
  periodic-rule: "0 0 0 1 1 *"

  todo-reminder: "0 0 0 1 1 *"
  notifications: "0 0 0 1 1 *"

server:
  port: 8080
  # Nginx терминирует TLS и передаёт X-Forwarded-Proto; без этого refresh-cookie
  # не получит флаг Secure.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
