spring:
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/family_budget_v3}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  flyway:
    enabled: true

logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: TRACE

schedule:
  periodic-rule: "0 0 0 1 1 *"

  todo-reminder: "0 0 0 1 1 *"
  notifications: "0 0 0 1 1 *"

server:
  port: 8080