plugins {
    id 'java'
    id 'org.springframework.boot' version "${springBoot}"
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdoc}"
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

def webDir = file("$rootDir/web")
def webDistDir = file("$webDir/dist")
def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def npmExec = isWindows ? 'npm.cmd' : 'npm'
def npmAvailable = (System.getenv('PATH') ?: '')
        .split(File.pathSeparator)
        .any { it && new File(it, npmExec).isFile() }

tasks.register('webBuild', Exec) {
    group = 'build'
    description = 'Собирает SPA из web/ (npm run build); пропускается с -PskipWebBuild или если npm не найден'
    onlyIf { !project.hasProperty('skipWebBuild') && npmAvailable }
    workingDir = webDir
    commandLine(npmExec, 'run', 'build')
    inputs.file(new File(webDir, 'package.json'))
    inputs.file(new File(webDir, 'package-lock.json'))
    inputs.file(new File(webDir, 'index.html'))
    inputs.file(new File(webDir, 'vite.config.ts'))
    inputs.dir(new File(webDir, 'src'))
    outputs.dir webDistDir
}

tasks.register('stageWebApp', Sync) {
    group = 'build'
    description = 'Готовит собранный SPA для упаковки в bootJar (classpath static)'
    dependsOn 'webBuild'
    from webDistDir
    into layout.buildDirectory.dir('generated/webapp/static')

    doFirst {
        if (!npmAvailable) {
            logger.warn("npm (${npmExec}) не найден в PATH — SPA не пересобирается, используется web/dist")
        }
        if (!new File(webDistDir, 'index.html').exists()) {
            logger.warn("Сборка SPA не найдена (${webDistDir}/index.html): / будет отдавать ранее собранный бандл (если он есть)")
        }
    }
}

tasks.named('processResources') {
    dependsOn 'stageWebApp'
    from(layout.buildDirectory.dir('generated/webapp'))
}

bootJar {
    // Фиксированное имя артефакта для деплоя
    archiveFileName = 'app.jar'

    dependsOn 'stageWebApp'
}

