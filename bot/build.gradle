plugins {
    id 'java'
    id 'org.springframework.boot' version "${springBoot}"
    id 'com.vaadin' version "${vaadin}"
}

vaadin {
    // Отключаем оптимизацию бандла для production (рекомендуется)
    optimizeBundle = false

    // Эти свойства будут переопределены через параметры командной строки
    productionMode = false
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdoc}"
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation "com.vaadin:vaadin-spring-boot-starter:${vaadin}"
    developmentOnly 'com.vaadin:vaadin-dev'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

repositories {
    maven { url = 'https://maven.vaadin.com/vaadin-addons' }
}

dependencyManagement {
    imports {
        mavenBom "com.vaadin:vaadin-bom:${vaadin}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

jar {
    dependsOn('vaadinBuildFrontend')
    manifest {
        attributes "Main-Class": "ru.mishapp.BotApp"
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

def webDir = file("$rootDir/web")
def webDistDir = file("$webDir/dist")
def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')

tasks.register('webBuild', Exec) {
    group = 'build'
    description = 'Собирает SPA из web/ (npm run build); пропускается с -PskipWebBuild'
    onlyIf { !project.hasProperty('skipWebBuild') }
    workingDir = webDir
    commandLine(isWindows ? 'npm.cmd' : 'npm', 'run', 'build')
    inputs.file(new File(webDir, 'package.json'))
    inputs.file(new File(webDir, 'package-lock.json'))
    inputs.file(new File(webDir, 'index.html'))
    inputs.file(new File(webDir, 'vite.config.ts'))
    inputs.dir(new File(webDir, 'src'))
    outputs.dir webDistDir
}

tasks.register('stageWebApp', Sync) {
    group = 'build'
    description = 'Готовит собранный SPA для упаковки в bootJar (classpath static/app)'
    dependsOn 'webBuild'
    from webDistDir
    into layout.buildDirectory.dir('generated/webapp/static/app')

    doFirst {
        if (!new File(webDistDir, 'index.html').exists()) {
            def message = "Сборка SPA не найдена (${webDistDir}/index.html): соберите SPA (npm run build в web/) " +
                    "или запустите сборку с -PskipWebBuild, чтобы собрать jar без SPA"
            if (project.hasProperty('skipWebBuild')) {
                logger.warn(message)
            } else {
                throw new GradleException(message)
            }
        }
    }
}

tasks.named('processResources') {
    dependsOn 'stageWebApp'
    from(layout.buildDirectory.dir('generated/webapp'))
}

bootJar {
    // Фиксированное имя артефакта для Docker-образа
    archiveFileName = 'app.jar'

    dependsOn 'stageWebApp'
}

