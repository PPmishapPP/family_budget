services:
  db:
    image: postgres:17
    container_name: family_budget_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: family_budget
      POSTGRES_USER: ${DATASOURCE_USERNAME:-usr}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD:-usr}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATASOURCE_USERNAME:-usr} -d family_budget"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    # Используем готовый образ, собранный на локальной машине.
    # Секция build оставлена для локальной разработки, на сервере она не используется.
    image: family_budget:latest
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: family_budget_bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATASOURCE_URL: jdbc:postgresql://db:5432/family_budget
      DATASOURCE_USERNAME: ${DATASOURCE_USERNAME:-usr}
      DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD:-usr}
    # Порт доступен ТОЛЬКО с localhost — наружу приложение отдаёт Nginx (HTTPS)
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  db_data:
